# Builds the installers natively on each OS. Push a tag like v1.0.1 to attach them to a GitHub release.
#
# Supply-chain hardening (details in SECURITY.md):
#  - the GITHUB_TOKEN is read-only everywhere; only the release job may write (create the release, sign the
#    build-provenance attestation)
#  - every action is pinned to a full commit SHA (the tag is in the comment); Dependabot proposes updates
#  - checkout does not keep the token in .git/config, and npm ci runs no install scripts
#  - the build stops when a production dependency has a known high/critical vulnerability or a package
#    fails npm's registry signature check
#  - the release gets SHA256SUMS.txt, a CycloneDX SBOM and a build-provenance attestation for every file
#  - no npm cache is used: a release build always installs exactly what package-lock.json pins
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Known vulnerabilities in the shipped (production) dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Registry signatures and provenance of all installed packages
        run: npm audit signatures
      # node-opcua-pki contains a Windows OpenSSL downloader without checksum verification. It is only reached
      # through its OpenSSL-based CA tools, which this app must not use (SECURITY.md, third-party components).
      - name: The OpenSSL downloader of node-opcua-pki stays unused
        run: |
          if grep -rnE "CertificateAuthority|install_prerequisite|with_openssl|crypto_create_CA|ensure_openssl_installed" src; then
            echo "::error::src/ must not use node-opcua-pki's OpenSSL-based CA tools"
            exit 1
          fi

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # no install scripts needed: no production dependency has one, and electron-builder downloads Electron itself
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify Electron fuses and licence notices of the packaged apps
        run: node scripts/verify-build.js
      # the Linux packages start through the launcher script written by build/afterPack.js
      # the launcher checks for the app's system libraries first (desktop distributions have them)
      - name: Install runtime libraries for the Linux smoke test
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-0 libnss3 libgbm1 libxss1 libxtst6 libasound2t64 || sudo apt-get install -y -qq libgtk-3-0 libnss3 libgbm1 libxss1 libxtst6 libasound2
      - name: Smoke test the Linux launcher (headless, no display)
        if: matrix.os == 'ubuntu-latest'
        run: |
          test -x dist/linux-unpacked/opcua-simulator.bin
          head -c 2 dist/linux-unpacked/opcua-simulator | grep -q '#!'
          sh -n dist/linux-unpacked/opcua-simulator
          env -u DISPLAY -u WAYLAND_DISPLAY dist/linux-unpacked/opcua-simulator --headless --help
      - name: Record the bundled Electron, Chromium and Node.js versions (for the SBOM)
        if: matrix.os == 'ubuntu-latest'
        run: ELECTRON_RUN_AS_NODE=1 dist/linux-unpacked/opcua-simulator.bin -p "JSON.stringify({electron:process.versions.electron,chrome:process.versions.chrome,node:process.versions.node})" > runtime-versions.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: runtime-versions
          path: runtime-versions.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  # Software bill of materials. A separate job, so the SBOM tool (fetched with npx) never runs where the
  # installers are built.
  sbom:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-versions
          path: runtime
      - name: CycloneDX SBOM (production dependencies = app.asar, plus the Electron runtime)
        env:
          # the SBOM tool's own dependencies are installed without running their install scripts
          npm_config_ignore_scripts: "true"
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p sbom
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-format JSON --output-file sbom/npm.cdx.json
          node scripts/sbom-finish.js sbom/npm.cdx.json "sbom/OPCUA-Simulator-${VERSION}-sbom.cdx.json" runtime/runtime-versions.json
          rm sbom/npm.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-sbom
          path: sbom/*.cdx.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release and upload its files
      id-token: write     # sign the build-provenance attestation (Sigstore, keyless)
      attestations: write # store the attestation in this repository
    steps:
      # only the installers and the SBOM; no other workflow artifact can end up in the release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: artifacts
          merge-multiple: true
      - name: SHA-256 checksums of all release files
        working-directory: artifacts
        run: |
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Build-provenance attestation for every release file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: artifacts/SHA256SUMS.txt
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          > **macOS: "Apple could not verify “OPC UA Simulator.app” is free of malware"** – expected: the app is not signed with a paid Apple certificate yet.
          > Click **Done**, then **System Settings → Privacy & Security → Open Anyway** (once). Windows: SmartScreen → **More info → Run anyway**. Details under *First start* below.

          ## Which file do I need?

          | System | File |
          |---|---|
          | Windows 10/11 | `OPCUA-Simulator-Setup-…-x64.exe` (installer) or `OPCUA-Simulator-Portable-…-x64.exe` (no installation) |
          | macOS, Apple silicon (M1 and newer) | `OPCUA-Simulator-…-mac-arm64.dmg` |
          | macOS, Intel | `OPCUA-Simulator-…-mac-x64.dmg` |
          | Debian / Ubuntu, desktop or server | `OPCUA-Simulator-…-linux-amd64.deb` (x64) or `…-linux-arm64.deb` (ARM) |
          | Any Linux | `…-linux-x86_64.AppImage` / `…-linux-arm64.AppImage`, or the `.tar.gz` |
          | Docker / headless servers | build the image from the source code: `docker compose up -d` |
          | Security review | `SHA256SUMS.txt` (checksums), `OPCUA-Simulator-…-sbom.cdx.json` (CycloneDX SBOM: npm packages plus the bundled Electron, Chromium and Node.js) |

          ## Check the download first

          These builds are not signed with a paid code-signing certificate yet. Before you allow the first start
          (next section), check that the file is the one this repository's CI built:

          - **Checksum**: put the file next to `SHA256SUMS.txt` and run
            `sha256sum -c SHA256SUMS.txt --ignore-missing` (Linux) or `shasum -a 256 -c SHA256SUMS.txt --ignore-missing` (macOS).
            Windows PowerShell: `Get-FileHash .\OPCUA-Simulator-Setup-…-x64.exe` and compare the hash with the line in `SHA256SUMS.txt`.
          - **Build provenance** (proves the file was built by this repository's GitHub Actions workflow from the tagged commit):
            `gh attestation verify <file> --repo Manjuhombaradi/opcua-simulator`

          Network use, data on disk, secure settings and how to report a vulnerability: [SECURITY.md](https://github.com/Manjuhombaradi/opcua-simulator/blob/main/SECURITY.md).

          ## First start

          Because the builds are unsigned, the system asks once before the first start.

          **macOS** – drag the app to Applications and open it. When macOS says *"Apple could not verify “OPC UA Simulator.app” is free of malware…"* (older versions: *"OPC UA Simulator" Not Opened*), click **Done**, then open **System Settings → Privacy & Security**, scroll down and click **Open Anyway** (confirm with your password). Or run once in Terminal:
          ```
          xattr -dr com.apple.quarantine "/Applications/OPC UA Simulator.app"
          ```

          **Windows** – when SmartScreen shows *"Windows protected your PC"*, click **More info → Run anyway** (installer and portable .exe).

          **Linux (.deb)** – `sudo apt install ./OPCUA-Simulator-*-linux-amd64.deb`, then start *OPC UA Simulator* from the app menu or run `opcua-simulator`.
          On a server or over SSH run `opcua-simulator --headless` (it also switches to headless mode by itself when there is no display); `opcua-simulator --headless --help` lists the options.

          **Linux (AppImage / .tar.gz)** – `chmod +x OPCUA-Simulator-*.AppImage && ./OPCUA-Simulator-*.AppImage` (add `--headless` on servers), or extract the `.tar.gz` and run `./opcua-simulator`. If system libraries are missing (minimal server images), the launcher prints the exact `apt` / `dnf` command to install them.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # re-run of this job: replace the files of the existing release
            gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag
          fi
